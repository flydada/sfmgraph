org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=false

# Environment
minecraft_version=1.21.1
neo_version=21.1.206
# Super Factory Manager - the mod this addon plugs into.
# The build compiles against this version, which is also the oldest one the addon supports, so the
# code cannot accidentally depend on APIs added later.
sfm_version=4.32.0
# Modrinth's immutable version id for that exact file. Version numbers are reused across Minecraft
# versions, so the id is what the build actually depends on (see build.gradle for the details).
sfm_version_id=lthZRkjn

# Mod properties
mod_id=sfmgraph
mod_name=SFM Graph Editor
mod_version=1.0.0
mod_group_id=dev.sfmgraph
