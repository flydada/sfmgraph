modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/flydada/sfmgraph/issues"

[[mods]]
modId = "sfmgraph"
version = "1.0.0"
displayName = "SFM Graph Editor"
authors = "sfmgraph"
description = '''
A visual node-graph editor for Super Factory Manager.

Label your blocks with SFM's label gun, then wire them up with nodes and links
instead of writing SFML by hand: choose which face of each block items, fluids
and energy go in or out of, and pick exactly how much is moved per tick.
The graph is compiled into a normal SFM program, so SFM itself still does all
the work.
'''

[[dependencies.sfmgraph]]
modId = "neoforge"
type = "required"
versionRange = "[21.0.0-beta,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.sfmgraph]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.sfmgraph]]
modId = "sfm"
type = "required"
versionRange = "[4.32.0,)"
ordering = "AFTER"
side = "BOTH"
