name: build

# Super Factory Manager is pulled from Modrinth and Minecraft is downloaded and decompiled on the
# first run, so a cold build takes a few minutes. The wrapper and the JDK version are pinned, which
# is what makes this reproducible.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle', 'gradle.properties') }}

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: sfmgraph-jar
          path: build/libs/*.jar
          if-no-files-found: error
